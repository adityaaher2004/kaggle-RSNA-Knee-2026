# SPEC: S3, S4, S7, S8, S9, S10 -- values here are authoritative [cfg]; edit specs.txt in same commit.
spec_version: 0.2.0
seed: 42                      # fold assignment seed, never changes (S9)
model_seeds: [0, 1, 2]
labels: [ACL, MCL, Medial Meniscus, Lateral Meniscus, Medial OA, Lateral OA, PF OA, Effusion, Synovitis, "Baker's", Contusion, Fracture]

data:
  cache_version: v1
  spacing_mm: 0.6             # in-plane resample (S3.2)
  size: 256                   # crop/pad -> 153.6 mm FOV
  max_slices_store: 48
  pct: [1.0, 99.5]            # per-series foreground window (S3.3)
  s_max: 6                    # series per study (S3.6)
  t_train: 10                 # windows per series, train (S3.5)
  t_eval: 16                  # windows per series, eval/test
  series_subset_p: 0.5
  aug: {scale: [0.8, 1.0], ratio: [0.9, 1.1], rot: 10, translate: 0.06, bc: 0.15, gamma: [0.8, 1.25], noise: 0.03, blur_p: 0.1, flip: false}

slice: {backbone: tf_efficientnetv2_s.in21k_ft_in1k, d: 384, pool: gem, drop: 0.2, drop_path: 0.1, grad_ckpt: true}
embed: {z_fourier: 16}
series: {layers: 2, heads: 6, ff: 1536, drop: 0.1}
head: {type: label_query, layers: 1, heads: 6, query_self_attn: false}
mil: {attn_dim: 256}          # ablation heads only (S7.5)

loss: {l_diag: 1.0, l_kd: 0.0, kd_mix: 0.5, l_aux: 0.0, entropy_w: 0.01, label_w: 1.0, target: soft}

train:
  opt: adamw
  betas: [0.9, 0.999]
  wd: 0.05
  lr_backbone: 2.0e-4
  lr_head: 1.0e-3
  lld: 0.85
  warmup_epochs: 1
  epochs: 12
  micro_batch: 4
  accum: 8
  clip: 1.0
  precision: bf16
  ema: 0.999
  workers: 16

labels_cfg: {min_gold_auc_slot: 0.7, low_slot_weight: 0.3, min_gold_pos_fit: 10}
sites: {min_cluster: 20}
dedup: {minhash_threshold: 0.8, feat_cos: 0.98}
folds: {n: 5, file: folds.csv}

inference: {tta: [identity, scale0.9], time_budget_h: 7.5, degrade: [t_eval10, fewer_models], write_every: 50}
